[tool.poetry]
name = "workshop-mle"
version = "0.1.0"
description = "Agentic coding workshop MLE starter"
authors = ["Workshop Participants"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = ">=2.2.3,<3.0"
scikit-learn = ">=1.5.2,<2.0"

[build-system]
requires = ["poetry-core>=1.6.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
