[tool.poetry]
name = "agentic-coding-workshop"
version = "0.1.0"
description = "Shared Python environment for the MLE and DE workshop"
authors = ["Workshop Participants"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = ">=2.2.3,<3.0"
scikit-learn = ">=1.5.2,<2.0"

[build-system]
requires = ["poetry-core>=1.6.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
